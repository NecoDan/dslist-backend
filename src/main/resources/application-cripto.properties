##################################################################################################################
# -- Database MySQL

# Config JPA - Ignore Database & Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=none

spring.jpa.database-platform=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/envlocaldb
spring.datasource.username=dbmysql
spring.datasource.password=${DB_PASSWORD_KEY:dbmysql123}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.tomcat.validation-query=SELECT 1

## default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

##################################################################################################################
# Config Cache Redis - Ignora e desabilita as configurações de cache do Redis
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
app.redis.enabled=false

# Força o Spring a usar um mapa em memória simples, ignorando o Redis para cache
spring.cache.type=simple

# Desativavando o cache completamente
#spring.cache.type=none